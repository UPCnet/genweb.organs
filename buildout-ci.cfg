[buildout]
extends = buildout.cfg

# Para CI, solo necesitamos instance y test
# Eliminamos partes que requieren dependencias complejas o no son necesarias
parts =
    instance
    test
    i18ndude

[test]
# Añadir robotframework para que plone.app.contenttypes.testing no falle
eggs = ${instance:eggs}
       plone.app.testing
       plone.app.robotframework
       coverage