[buildout]
extends =
    https://dist.plone.org/release/6.0.15/versions.cfg

extensions = mr.developer
always-checkout = false
show-picked-versions = true
find-links = https://pypi.upc.edu/links

parts =
    instance
    test

auto-checkout =
    genweb6.core
    genweb6.theme
    genweb6.upc
    genweb.organs

[sources]
genweb6.core = git https://github.com/UPCnet/genweb6.core.git branch=master
genweb6.theme = git https://github.com/UPCnet/genweb6.theme.git branch=master  
genweb6.upc = git https://github.com/UPCnet/genweb6.upc.git branch=master
genweb.organs = git https://github.com/UPCnet/genweb.organs.git branch=pyto3

[instance]
recipe = plone.recipe.zope2instance
http-address = 8080
user = admin:admin
environment-vars =
    zope_i18n_compile_mo_files true
    PTS_LANGUAGES ca es en
    zope_i18n_allowed_languages ca es en

eggs =
    Plone
    Pillow
    genweb6.core
    genweb6.theme
    genweb6.upc
    genweb.organs

[test]
recipe = zc.recipe.testrunner
eggs = ${instance:eggs}
       plone.app.testing
       plone.app.robotframework
       coverage
defaults = ['-s', 'genweb.organs', '--exit-with-status', '--auto-color', '--auto-progress', '--verbose']

[versions]
setuptools =
zc.buildout =
