# Python CircleCI 2.1 configuration file
# Updated for Plone 6 + Python 3.11
version: 2.1

jobs:
  build:
    docker:
      - image: cimg/python:3.11

    working_directory: ~/repo

    steps:
      - checkout

      - run:
          name: Install system dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y libsasl2-dev python3-dev libldap2-dev libssl-dev libxml2-dev libxslt1-dev libjpeg-dev libfreetype6-dev liblcms2-dev libwebp-dev libharfbuzz-dev libfribidi-dev libxcb1-dev

      - run:
          name: Setup Python environment
          command: |
            python -m venv venv
            source venv/bin/activate
            pip install --upgrade pip setuptools wheel

      - run:
          name: Install requirements and buildout
          command: |
            source venv/bin/activate
            pip install -r requirements.txt
            buildout -N -c organs.cfg
            buildout -N -c organs.cfg

      - run:
          name: Run Python tests
          command: |
            source venv/bin/activate
            bin/test -t genweb.organs

      - run:
          name: Run coverage
          command: |
            source venv/bin/activate
            bin/coverage run --source=src/genweb.organs bin/test -t genweb.organs
            bin/coverage report
            bin/coverage html

      - store_test_results:
          path: parts/test

      - store_artifacts:
          path: htmlcov
          destination: coverage-report